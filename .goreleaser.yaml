version: 2

before:
  hooks:
    - go mod download
    # Builds internal/lambdacode/assets/bootstrap.zip, embedded in bedrock-admin.
    - go generate ./...

builds:
  - id: bedrock-admin
    main: ./cmd/bedrock-admin
    binary: bedrock-admin
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
  - id: bedrock
    main: ./cmd/bedrock
    binary: bedrock
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    goos: [darwin, linux]
    goarch: [amd64, arm64]

archives:
  - id: bedrock-admin
    ids: [bedrock-admin]
    name_template: "bedrock-admin_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
  - id: bedrock
    ids: [bedrock]
    name_template: "bedrock_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^Merge "
  # Grouped by the Conventional Commit type; the first group a commit matches wins.
  groups:
    - title: Breaking changes
      regexp: '^.*?\w+(\(.+\))??!:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\(.+\))??:.+$'
      order: 1
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??:.+$'
      order: 2
    - title: Performance
      regexp: '^.*?perf(\(.+\))??:.+$'
      order: 3
    - title: Refactoring
      regexp: '^.*?refactor(\(.+\))??:.+$'
      order: 4
    - title: Documentation
      regexp: '^.*?docs(\(.+\))??:.+$'
      order: 5
    - title: Tests
      regexp: '^.*?test(\(.+\))??:.+$'
      order: 6
    - title: Build and CI
      regexp: '^.*?(build|ci)(\(.+\))??:.+$'
      order: 7
    - title: Other
      order: 999
