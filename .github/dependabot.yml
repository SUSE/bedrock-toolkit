# Security updates only: open-pull-requests-limit 0 turns off version updates, but Dependabot still
# opens security update PRs (repo setting "Dependabot security updates"). CI-passing ones merge
# automatically through .github/workflows/dependabot-merge.yml.
version: 2
updates:
  # Go modules ship in both CLIs and the Lambda, so they count as fixes in the release notes.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    commit-message:
      prefix: fix(deps)
    groups:
      go-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci(deps)
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  # The e2e test image (tests/e2e/Dockerfile and requirements.txt); not shipped.
  - package-ecosystem: pip
    directory: /tests/e2e
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    commit-message:
      prefix: test(deps)
    groups:
      e2e-pip-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /tests/e2e
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    commit-message:
      prefix: test(deps)
