name: Commits

# Every commit in a PR must have a Conventional Commit subject and a Signed-off-by line for its author
# (bots are exempt from the sign-off), and so must the PR title, which squash merges use on main.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      # The script comes from the base branch's current tip, so a PR can't change the check it is held to.
      # (pull_request.base.sha is the base when the PR branch was last pushed, which can predate the script.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - name: Fetch the PR's commits
        env:
          NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "refs/pull/$NUMBER/head"
      - name: Check the PR title and commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/check-commits.sh HEAD "$PR_HEAD"
